<!DOCTYPE html><html lang='ko'><head><meta charset='utf-8'><title>보드2 어떻게 쓰나</title><style>
*{box-sizing:border-box}
body{margin:0;word-break:keep-all;background:#ece9e2;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#22261f}
.board{width:1200px;height:760px;background:#faf8f3;padding:56px 64px;display:flex;flex-direction:column;gap:28px;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:12px}
.pill{background:#2f3a2f;color:#fff;border-radius:999px;padding:6px 16px;font-size:15px;font-weight:700}
.pill b{background:#6e9473;border-radius:999px;padding:2px 10px;margin-right:8px}
.page{margin-left:auto;font-size:15px;color:#7a7f73;font-weight:700}
h1{margin:0;font-size:46px;line-height:1.3;letter-spacing:-1px}
h1 em{font-style:normal;color:#4f7a5a}
h2{margin:0;font-size:36px;line-height:1.3;letter-spacing:-.5px}
.lead{font-size:21px;line-height:1.6;margin:0;color:#3a3f36}
.lead b{color:#22261f}
.row{display:flex;gap:24px}
.box{background:#fff;border:1px solid #e3dfd5;border-radius:18px;padding:24px}
.price{background:#e6efe4;border:0;flex:0 0 400px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.pr{display:flex;justify-content:space-between;align-items:baseline;font-size:18px}
.pr strong{font-size:22px;color:#3f6a4a}
.pr strong.big{font-size:34px}
.items{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
.it{display:flex;gap:14px;align-items:flex-start;font-size:19px;line-height:1.5}
.dot{width:12px;height:12px;border-radius:50%;margin-top:9px;flex:0 0 12px}
.note{font-size:15px;color:#7a7f73;margin-top:auto}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;flex:1}
.step{background:#f0ede5;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:18px;align-items:center}
.phone{width:210px;height:330px;border:9px solid #262a24;border-radius:30px;background:#fff;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.ph-t{font-size:12px;color:#4f7a5a;font-weight:700}
.ph-h{font-size:16px;font-weight:700}
.ankle{flex:1;border-radius:12px;background:#f3e7dc;position:relative}
.ankle i{position:absolute;width:22px;height:22px;border-radius:50%;border:4px solid #4f7a5a;background:#fff}
.ring{flex:1;display:flex;align-items:center;justify-content:center}
.ring div{width:120px;height:120px;border-radius:50%;border:12px solid #4f7a5a;border-right-color:#dfe8dc;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.btn{background:#4f7a5a;color:#fff;border-radius:10px;text-align:center;padding:9px;font-size:14px;font-weight:700}
.cal{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-content:start;margin-top:6px}
.cal span{height:22px;border-radius:5px;background:#e6ebe4}
.cal span.on{background:#4f7a5a}
.cap{font-size:20px;font-weight:700;line-height:1.45;text-align:center}
.cap small{display:block;font-size:16px;font-weight:400;color:#5d6258;margin-top:4px}
.n{display:inline-flex;width:30px;height:30px;border-radius:50%;background:#262a24;color:#fff;align-items:center;justify-content:center;font-size:16px;margin-right:6px;vertical-align:2px}
table{width:100%;border-collapse:collapse;font-size:20px}
th{text-align:left;font-size:16px;color:#7a7f73;padding:0 18px 12px;border-bottom:2px solid #262a24}
td{padding:22px 18px;border-bottom:1px solid #e0dccf;vertical-align:top;line-height:1.5}
td:first-child{font-weight:700;width:230px}
td:last-child{color:#3f6a4a;font-weight:700}
</style></head><body><div class='board'><div class='top'><span class='pill'><b>웰니스 셀프케어</b>첫 번째 루틴 · 발목 혈자리</span><span class='page'>2 / 3 · 어떻게 쓰나</span></div>
<h2>앱이 짚고, 기기가 누르고, 앱에 남아요</h2>
<div class='steps'>
 <div class='step'>
  <div class='phone'><div class='ph-t'>오늘의 셀프케어</div><div class='ph-h'>발목 안쪽, 여기예요</div>
   <div class='ankle'><i style='left:45%;top:28%'></i><i style='left:22%;top:55%'></i><i style='left:62%;top:66%'></i></div></div>
  <div class='cap'><span class='n'>1</span>앱이 자리를 짚어요<small>카메라로 비춘 내 발목 위에 표시</small></div>
 </div>
 <div class='step'>
  <div class='phone'><div class='ph-t'>케어 중 · 편안하게</div><div class='ring'><div>02:30</div></div><div class='btn'>멈추기</div></div>
  <div class='cap'><span class='n'>2</span>기기가 대신 눌러요<small>일하거나 쉬는 동안, 두 손은 자유롭게</small></div>
 </div>
 <div class='step'>
  <div class='phone'><div class='ph-t'>이번 달 나를 챙긴 날</div>
   <div class='cal'><span></span><span class='on'></span><span></span><span></span><span class='on'></span><span></span><span></span><span></span><span class='on'></span><span class='on'></span><span></span><span></span><span></span><span class='on'></span><span></span><span></span><span class='on'></span><span></span><span></span><span></span><span class='on'></span><span></span><span class='on'></span><span></span></div><div class='btn'>패치 교체 알림 받기</div></div>
  <div class='cap'><span class='n'>3</span>내 자리와 기록이 남아요<small>다음엔 영상을 다시 찾지 않아도 돼요</small></div>
 </div>
</div></div></body></html>
